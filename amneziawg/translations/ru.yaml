---
configuration:
  awg_conf:
    name: Конфиг AmneziaWG
    description: >-
      Необязательный клиентский конфиг. Если поле не пустое, оно заменяет
      структурированные ключи. Table, DNS, FwMark и PreUp/PostUp/PreDown/PostDown
      игнорируются. AllowedIPs внутри туннеля принудительно 0.0.0.0/0; маршрут
      по умолчанию хоста не меняется. Вставляйте в режиме YAML блоком `|`.
  private_key:
    name: Приватный ключ интерфейса
    description: Используется, только если вставленный конфиг пуст. Не коммитьте настоящий ключ.
  address:
    name: Адрес в туннеле
    description: IPv4-адрес этого клиента, например 10.8.0.2/32. Если задан вставленный конфиг, берётся из него.
  jc:
    name: Jc
    description: Число мусорных пакетов перед handshake. 0 не записывает Jc/Jmin/Jmax. Должно совпадать с сервером, если обфускация включена.
  jmin:
    name: Jmin
    description: Минимальный размер мусорного пакета. Не больше Jmax.
  jmax:
    name: Jmax
    description: Максимальный размер мусорного пакета. Не меньше Jmin.
  s1:
    name: S1
    description: Паддинг пакета инициации. 0 не записывает поле.
  s2:
    name: S2
    description: Паддинг пакета ответа. 0 не записывает поле.
  h1:
    name: H1
    description: Заголовок пакета инициации, число или диапазон вроде 123-456. Пусто — поле не записывается.
  h2:
    name: H2
    description: Заголовок пакета ответа, число или диапазон. Пусто — поле не записывается.
  h3:
    name: H3
    description: Заголовок cookie-пакета, число или диапазон. Пусто — поле не записывается.
  h4:
    name: H4
    description: Заголовок транспортного пакета, число или диапазон. Пусто — поле не записывается.
  peer_public_key:
    name: Публичный ключ сервера
    description: Используется, только если вставленный конфиг пуст.
  preshared_key:
    name: Preshared key
    description: Необязательно. Оставьте пустым, если сервер его не использует.
  endpoint:
    name: Endpoint
    description: Сервер в виде host:port или IPv4:port. Имя резолвится через upstream DNS, не через туннель.
  keepalive:
    name: Persistent keepalive
    description: Секунды. 25 подходит для NAT на LTE. 0 выключает. Подставляется, если во вставленном конфиге нет строки PersistentKeepalive.
  mtu:
    name: MTU
    description: MTU туннеля. 1280 — значение по умолчанию для LTE. Строка MTU во вставленном конфиге его перекрывает.
  domains:
    name: Домены
    description: >-
      Запрос этого имени или любого поддомена читается из DNS-ответов, которые
      хост и так получает. Укажите родительские имена. Свой резолвер дополнение
      не поднимает и настройки DNS не меняет.
  cidrs:
    name: CIDR
    description: Префиксы IPv4, которые всегда идут через туннель. 0.0.0.0/0 отклоняется.
  exclude_cidrs:
    name: Исключённые CIDR
    description: Эти назначения в туннель не отправляются. 192.168.2.0/24 — LAN. Tailscale 100.64.0.0/10 и сеть Home Assistant исключаются всегда.
  strict:
    name: Строгий режим
    description: Если handshake устарел, выбранные назначения отбрасываются, а не уходят в обычный маршрут. Включён по умолчанию.
  warmup:
    name: Прогрев точных имён
    description: При старте один раз резолвит каждое имя из списка через системный резолвер. Поддомены узнаются только когда их кто-то реально запрашивает.
  route_timeout:
    name: Таймаут маршрута
    description: Сколько секунд выученный адрес остаётся в наборе. Каждый следующий увиденный DNS-ответ обновляет таймер. По умолчанию сутки.
  log_level:
    name: Уровень логов
    description: Подробность журнала дополнения.
