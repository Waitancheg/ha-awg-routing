name: Build add-on images

on:
  push:
    branches:
      - main
      # This branch publishes 1.0.1 before main's config.yaml points at it.
      - cursor/prebuilt-images-1355
    tags:
      - "*"
  workflow_dispatch:

permissions:
  contents: read

env:
  ARCHITECTURES: '["amd64", "aarch64"]'
  IMAGE_NAME: addon-amneziawg

jobs:
  init:
    name: Initialize build
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Read add-on version
        id: version
        run: |
          version=$(awk '/^version:/ { print $2; exit }' amneziawg/config.yaml | tr -d "\"'")
          test -n "${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Get build matrix
        id: matrix
        uses: home-assistant/builder/actions/prepare-multi-arch-matrix@2026.09.0
        with:
          architectures: ${{ env.ARCHITECTURES }}
          image-name: ${{ env.IMAGE_NAME }}
          registry-prefix: ghcr.io/waitancheg

  build:
    name: Build ${{ matrix.arch }}
    needs: init
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.init.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Build and push ${{ matrix.arch }}
        uses: home-assistant/builder/actions/build-image@2026.09.0
        with:
          arch: ${{ matrix.arch }}
          context: amneziawg
          container-registry: ghcr.io
          container-registry-username: ${{ github.repository_owner }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          image: ${{ matrix.image }}
          image-tags: ${{ needs.init.outputs.version }}
          push: "true"
          version: ${{ needs.init.outputs.version }}
          cosign: "false"

  visibility:
    name: Make packages public
    needs: [init, build]
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Set GHCR visibility to public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          ok=0
          for pkg in amd64-addon-amneziawg aarch64-addon-amneziawg; do
            echo "::group::${pkg}"
            gh api --method PUT -H "Accept: application/vnd.github+json" \
              "/user/packages/container/${pkg}/visibility" -f visibility=public
            put_status=$?
            gh api --method PATCH -H "Accept: application/vnd.github+json" \
              "/user/packages/container/${pkg}" -f visibility=public
            patch_status=$?
            echo "put=${put_status} patch=${patch_status}"
            if [[ "${put_status}" -eq 0 || "${patch_status}" -eq 0 ]]; then
              ok=$((ok + 1))
            fi
            echo "::endgroup::"
          done
          echo "public_ok=${ok}" >> "$GITHUB_ENV"

      - name: Pull without credentials
        env:
          VERSION: ${{ needs.init.outputs.version }}
        run: |
          docker logout ghcr.io || true
          docker pull "ghcr.io/waitancheg/amd64-addon-amneziawg:${VERSION}"
          docker pull "ghcr.io/waitancheg/aarch64-addon-amneziawg:${VERSION}"
